{{ define "main" }}
<article class="page">
  {{ partial "freshness.html" . }}
  {{ .Content }}
  {{ with .Pages }}
    <nav class="child-list">
      <h2>In this section</h2>
      <ul>
        {{ range . }}
          <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{ with .Description }}<span>{{ . }}</span>{{ end }}
          </li>
        {{ end }}
      </ul>
    </nav>
  {{ end }}
</article>
{{ end }}
