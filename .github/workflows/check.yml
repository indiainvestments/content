name: Checks

on:
  pull_request:
  workflow_dispatch:

env:
  HUGO_VERSION: 0.165.0

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        run: hugo --gc --minify

      - name: Legacy URL parity
        run: python3 scripts/check_urls.py

      - name: Internal link and image check
        run: python3 scripts/check_links.py

      - name: Previous/Next ordering check
        run: python3 scripts/check_pagenav.py

      - name: Check markdown to keep it standard 
        run: python3 scripts/check_markdown.py
